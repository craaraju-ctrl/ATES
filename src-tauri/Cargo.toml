[package]
name = "ates-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.11", features = ["json"] }

# ATES Core + Agents integration
ates-core = { path = "../crates/ates-core" }
ates-agents = { path = "../crates/ates-agents" }
ates-autonomous = { path = "../crates/ates-autonomous" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "ates-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"