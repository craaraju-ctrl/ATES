[package]
name = "ates-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
redb = "1.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
axum = { version = "0.7", features = ["json"] }