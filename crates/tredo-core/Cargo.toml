[package]
name = "tredo-core"
version = "0.1.0"
description = "tredo-core — Disciplined Core, memory (redb), LLM, Kronos client (Trading Real-time Edge Decision Optimisation)"
edition = "2021"

[dependencies]
async-trait = "0.1"
redb = "1.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
quick-xml = "0.31"
