[package]
name = "ates-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
ates-core = { path = "../ates-core" }
ates-agents = { path = "../ates-agents" }
ates-autonomous = { path = "../ates-autonomous" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }