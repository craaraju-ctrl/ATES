[package]
name = "ates-autonomous"
version = "1.0.0"
edition = "2021"

[dependencies]
ates-core = { path = "../ates-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"